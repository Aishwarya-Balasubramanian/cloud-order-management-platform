apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management-worker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-management-worker

  template:
    metadata:
      labels:
        app: order-management-worker

    spec:
      containers:
        - name: worker
          image: ORDER_MANAGEMENT_IMAGE

          command:
            - python
            - -m
            - app.workers.order_worker

          envFrom:
            - configMapRef:
                name: order-management-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-management-secrets
                  key: DB_PASSWORD

            - name: ORDER_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: order-management-secrets
                  key: ORDER_QUEUE_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"