apiVersion: batch/v1
kind: Job
metadata:
  name: order-management-migration
  labels:
    app: order-management
    component: migration
spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: order-management
        component: migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: order-management-api:latest

          command:
            - alembic
            - upgrade
            - head

          envFrom:
            - configMapRef:
                name: order-management-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-management-secrets
                  key: DB_PASSWORD