apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-management-api

  template:
    metadata:
      labels:
        app: order-management-api

    spec:
      containers:
        - name: api
          image: ORDER_MANAGEMENT_IMAGE

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: order-management-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-management-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: order-management-secrets
                  key: JWT_SECRET

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"